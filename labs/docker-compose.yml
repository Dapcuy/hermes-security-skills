# =============================================================================
# labs/docker-compose.yml — lab environment terisolasi (ROADMAP §42, §8)
#
# FUNGSI: aplikasi vulnerable lokal untuk benchmark & quality (Phase 11 §42)
# dan reasoning dry-run. SEMUA target di lab adalah offline-lab.
#
# PERINGATAN AUTHORIZATION (§8):
#   Lab ini HANYA untuk authorization status "offline-lab". Mengarahkan
#   skill / validator / hermes-proxy ke target DI LUAR lab tanpa
#   authorization "granted" yang eksplisit adalah pelanggaran policy keras.
#   URL yang diberikan user tidak otomatis berarti authorization (§8).
#
# ISOLASI:
#   - network "lab-net" memakai internal: true → TIDAK ada route/egress ke
#     internet; container lab hanya bisa saling mengakses (§16 deny-by-default
#     di level lab). Uji: container yang mencoba akses jaringan harus gagal.
#   - Tidak ada ports: (publish ke host). Akses internal via DNS service
#     name, mis. http://juice-shop:3000 dari container lain di lab-net.
#   - Akses inspeksi manual dari host: jalankan one-off container di
#     network yang sama, mis.:
#       docker run --rm --network hermes-lab-net curlimages/curl \
#         -s http://juice-shop:3000 -o /dev/null -w '%{http_code}\n'
#
# PENGGUNAAN:
#   make lab-up    → docker compose -f labs/docker-compose.yml up -d
#   make lab-down  → docker compose -f labs/docker-compose.yml down
#
# CATATAN AIR-GAP: `internal: true` hanya membatasi jaringan container.
# `docker compose up` tetap menarik image dari registry lewat host —
# pre-pull dulu (docker pull) sebelum memutus koneksi host.
# =============================================================================

services:
  # --- OWASP Juice Shop ------------------------------------------------------
  juice-shop:
    image: bkimminich/juice-shop:latest   # TODO pin ke digest untuk run serius (§14)
    container_name: hermes-lab-juice-shop
    networks:
      - lab-net
    # Port TIDAK dipublish ke host; hanya expose internal di lab-net.
    expose:
      - "3000"
    # Resource baseline §15 (lab tidak butuh lebih).
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL           # juice-shop (Node.js, user non-root) aman tanpa capability
    restart: "no"     # ephemeral: lab hidup selama sesi benchmark saja

  # --- DVWA -------------------------------------------------------------------
  dvwa:
    image: vulnerables/web-dvwa:latest    # TODO pin ke digest untuk run serius (§14)
    container_name: hermes-lab-dvwa
    networks:
      - lab-net
    expose:
      - "80"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    # catatan: cap_drop: ALL TIDAK diterapkan untuk DVWA — apache di image
    # ini perlu CAP_NET_BIND_SERVICE untuk bind port 80. Deviasi sadar dari
    # baseline §15, dikompensasi oleh network internal + resource limits.
    # Escalation ke baseline penuh: reverse-proxy non-root di depan DVWA
    # (post-MVP).
    restart: "no"

networks:
  lab-net:
    name: hermes-lab-net
    driver: bridge
    internal: true    # ← inti isolasi: tanpa egress internet (§16)
