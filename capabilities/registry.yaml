# Capability registry — Hermes Security Skills (ROADMAP v3.0 §12)
# Sumber kebenaran untuk capability abstraction (ROADMAP §4/§12).
# Skill meminta capability, BUKAN tool; provider ditentukan di sini.
#
# File ini READ-ONLY dari sudut pandang Hermes (ROADMAP §7).
# Format: YAML subset sederhana (map / seq / string / int / bool) —
# tanpa anchor, tanpa multiline-flow, tanpa fitur kompleks.
# Lihat capabilities/schemas/README.md untuk field yang valid.
#
# CATATAN v3.0 (§12):
#   - Capability TIDAK lagi memetakan tool pihak ketiga satu-per-satu.
#     Mapping capability -> tool (image, versi, digest, risk, approval per
#     tool) pindah ke Tool Registry: tools/registry.yaml (ROADMAP §36).
#     Contoh: endpoint_discovery lewat nmap mewajibkan approval "always"
#     — keputusan itu ada di Tool Registry, bukan di sini.
#   - list_history bukan capability: ia operasi read-only internal control
#     plane (event store) dan diekspos langsung sebagai MCP tool
#     security.list_history.

version: 3

# Fallback semantics (ROADMAP §5.1 / §12) — fail-closed:
#   1. Provider utama UNAVAILABLE = capability GAGAL dengan error
#      eksplisit. TIDAK ada silent degrade, TIDAK ada fallback otomatis.
#   2. Policy denial = stop, bukan fallback.
#   3. Provider yang tidak memenuhi syarat capability (mis. butuh
#      network tapi berjalan network=none) WAJIB menolak eksplisit.
#   4. Operasi read-only (history/inspect) boleh dilayani provider
#      lain karena tidak mengirim traffic ke target.
fallback_semantics: fail-closed

capabilities:

  inspect_request:
    risk: low
    default_provider: proxy
    requires_scope: true
    requires_network: false

  request_replay:
    risk: medium
    default_provider: proxy
    requires_scope: true
    requires_network: true
    requires_approval: conditional

  # Mutasi request terkendali (safe mutation) via hermes-proxy —
  # satu-satunya jalur egress (ROADMAP §25).
  request_mutation:
    risk: medium
    default_provider: proxy
    requires_scope: true
    requires_network: true
    requires_approval: conditional

  # Perbandingan dua exchange yang SUDAH terekam (evidence) — murni
  # komputasi lokal di control plane, tanpa traffic ke target.
  response_comparison:
    risk: low
    default_provider: local
    requires_scope: false
    requires_network: false

  # Controlled discovery permukaan. Mapping ke tool pihak ketiga
  # (subfinder / httpx / ffuf / nmap) via Tool Registry (ROADMAP §36):
  # tools/registry.yaml — risk, approval requirement, image, digest,
  # dan network requirement spesifik per tool ditentukan DI SANA,
  # bukan di capability ini (mis. nmap = approval "always").
  endpoint_discovery:
    risk: medium
    default_provider: tool
    requires_scope: true
    requires_network: true

  # Validation berbasis template. Mapping ke Tool Registry:
  # nuclei + templates ter-pin (templates_version di Tool Registry;
  # runtime tidak pernah auto-update template, ROADMAP §41).
  template_based_validation:
    risk: medium
    default_provider: tool
    requires_scope: true
    requires_network: true

  openapi_analysis:
    risk: low
    default_provider: docker
    requires_scope: false
    requires_network: false
    image: hermes-validator-openapi

  json_diff:
    risk: low
    default_provider: local
    requires_scope: false
    requires_network: false
