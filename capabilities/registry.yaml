# Capability registry — Hermes Security Skills
# Sumber kebenaran untuk capability abstraction (ROADMAP 5).
# Skill meminta capability, BUKAN tool; provider ditentukan di sini (ROADMAP 4.1).
#
# File ini READ-ONLY dari sudut pandang Hermes (ROADMAP 4.3, 4.4).
# Format: YAML subset sederhana (map / seq / string / int / bool) —
# tanpa anchor, tanpa multiline-flow, tanpa fitur kompleks.
# Lihat capabilities/schemas/README.md untuk field yang valid.

version: 1

# Fallback semantics (ROADMAP 5.1) — fail-closed:
#   1. Provider utama UNAVAILABLE = capability GAGAL dengan error
#      eksplisit. TIDAK ada silent degrade, TIDAK ada fallback otomatis.
#   2. Policy denial = stop, bukan fallback.
#   3. Provider yang tidak memenuhi syarat capability (mis. butuh
#      network tapi berjalan network=none) WAJIB menolak eksplisit.
#   4. Operasi read-only (history/inspect) boleh dilayani provider
#      lain karena tidak mengirim traffic ke target.
fallback_semantics: fail-closed

capabilities:

  inspect_request:
    risk: low
    default_provider: proxy
    requires_scope: true
    requires_network: false

  request_replay:
    risk: medium
    default_provider: proxy
    requires_scope: true
    requires_network: true
    requires_approval: conditional

  response_comparison:
    risk: low
    default_provider: proxy
    requires_scope: true
    requires_network: false

  list_history:
    risk: low
    default_provider: proxy
    requires_scope: false
    requires_network: false

  json_diff:
    risk: low
    default_provider: local
    requires_scope: false
    requires_network: false

  openapi_analysis:
    risk: low
    default_provider: docker
    requires_scope: false
    requires_network: false
    image: hermes-validator-openapi

  # --- Capability tool pihak ketiga (ROADMAP §13.1) ---
  # Satu tool = satu image terkurasi (hermes-tool-*), di-build dan di-sign
  # saat CI, tanpa install saat runtime. Wrapper di dalam image menegakkan
  # policy bundle, budget, dan rate limit dari execution plan, lalu
  # mengubah output tool menjadi validation-result.json + evidence dengan
  # provenance. requires_network: true menandai image yang butuh egress
  # terkendali — ke data source pihak ketiga (passive recon) atau ke
  # target yang sudah lolos scope validation — dan hanya aktif setelah
  # jalur egress tersedia (post-MVP, ROADMAP §5.2).

  # Enumerasi subdomain pasif: egress hanya ke third-party data sources
  # (sifat passive recon — tidak ada request ke target); domain target
  # wajib in-scope.
  subfinder_enum:
    risk: low
    default_provider: docker
    requires_scope: true
    requires_network: true
    image: hermes-tool-subfinder

  # HTTP probing atas daftar URL in-scope: status, title, indikasi
  # teknologi per URL.
  httpx_probe:
    risk: low
    default_provider: docker
    requires_scope: true
    requires_network: true
    image: hermes-tool-httpx

  # Port scanning aktif = risk HIGH: approval eksplisit SELALU wajib
  # (policy/risk.yaml high -> approval_required, tidak pernah automatic);
  # metode dan port range dibatasi execution plan (ROADMAP §8, §13.1, §14).
  nmap_scan:
    risk: high
    default_provider: docker
    requires_scope: true
    requires_network: true
    requires_approval: always
    image: hermes-tool-nmap

  # Directory fuzzing terkendali: wordlist ter-bake di image, budget dan
  # rate limit dipaksa wrapper; approval conditional sesuai risk medium.
  ffuf_fuzz:
    risk: medium
    default_provider: docker
    requires_scope: true
    requires_network: true
    requires_approval: conditional
    image: hermes-tool-ffuf
