# CI Skills — skill-linter untuk seluruh skills/ (ROADMAP §7.1, §32)
# Semua skill wajib lolos linter otomatis sejak Phase 1.
name: ci-skills

on:
  push:
    paths:
      - "skills/**"
      - "tools/skill-linter/**"
      - "benchmarks/**"
      - "tests/benchmark/**"
      - ".github/workflows/ci-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/skill-linter/**"
      - "benchmarks/**"
      - "tests/benchmark/**"
      - ".github/workflows/ci-skills.yml"

permissions:
  contents: read

jobs:
  lint-skills:
    name: Skill linter (skills/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Jalankan skill-linter terhadap skills/
        run: python tools/skill-linter/lint.py skills/

      - name: Validasi schema dan workflow benchmark
        run: python -m unittest discover -s tests/benchmark -v
