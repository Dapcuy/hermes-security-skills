# CI Skills — skill-linter untuk seluruh skills/ (ROADMAP §7.1, §32)
# Semua skill wajib lolos linter otomatis sejak Phase 1.
name: ci-skills

on:
  push:
    paths:
      - "skills/**"
      - "tools/skill-linter/**"
      - ".github/workflows/ci-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tools/skill-linter/**"
      - ".github/workflows/ci-skills.yml"

permissions:
  contents: read

jobs:
  lint-skills:
    name: Skill linter (skills/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan skill-linter terhadap skills/
        run: python tools/skill-linter/lint.py skills/
