# Deployment CI — validate runtime supply chain on PRs.
# This workflow is intentionally read-only: no registry login, publish, or signing.
name: ci-deployment

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "runtimes/**"
      - "tools/**"
      - "policy/**"
      - "capabilities/**"
      - "schemas/**"
      - "docs/**"
      - "deploy/**"
      - "scripts/**"
      - ".dockerignore"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "runtimes/**"
      - "tools/**"
      - "policy/**"
      - "capabilities/**"
      - "schemas/**"
      - "docs/**"
      - "deploy/**"
      - "scripts/**"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  dockerfile-pinning:
    name: Dockerfile base-image pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate all Dockerfiles
        run: python tools/docker-linter/check.py runtimes/docker/images

  build-and-scan:
    name: Build and scan ${{ matrix.name }}
    needs: dockerfile-pinning
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: http-validator
            dockerfile: runtimes/docker/images/http-validator/Dockerfile
          - name: json-validator
            dockerfile: runtimes/docker/images/json-validator/Dockerfile
          - name: openapi-validator
            dockerfile: runtimes/docker/images/openapi-validator/Dockerfile
          - name: python-validator
            dockerfile: runtimes/docker/images/python-validator/Dockerfile
          - name: proxy
            dockerfile: runtimes/docker/images/proxy/Dockerfile
          - name: tool-nuclei
            dockerfile: runtimes/docker/images/tool-nuclei/Dockerfile
          - name: tool-subfinder
            dockerfile: runtimes/docker/images/tool-subfinder/Dockerfile
          - name: tool-httpx
            dockerfile: runtimes/docker/images/tool-httpx/Dockerfile
          - name: tool-nmap
            dockerfile: runtimes/docker/images/tool-nmap/Dockerfile
          - name: tool-ffuf
            dockerfile: runtimes/docker/images/tool-ffuf/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: hermes-ci/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: hermes-ci/${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif
          if-no-files-found: error

  operations-config:
    name: Validate monitoring, healthcheck, and operations artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate shell wrappers
        run: |
          bash -n scripts/maintenance.sh scripts/deploy-production.sh scripts/rollback-compose.sh
          if bash scripts/deploy-production.sh ghcr.io/acme/hermes-proxy:latest; then exit 1; fi
          if bash scripts/rollback-compose.sh ghcr.io/acme/hermes-proxy:latest; then exit 1; fi
          python tools/compose-linter/check.py \
            --compose deploy/compose/production.yaml \
            --image ghcr.io/acme/hermes-proxy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --bundle-sha256 bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - name: Validate production Compose
        env:
          HERMES_PROXY_IMAGE: ghcr.io/example/hermes-proxy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          HERMES_BUNDLE_SHA256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          HERMES_POLICY_DIR: policy
        run: docker compose -f deploy/compose/production.yaml config
      - name: Validate monitoring Compose
        env:
          HERMES_PROMETHEUS_CONFIG: ${{ github.workspace }}/deploy/monitoring/prometheus.yml
          HERMES_ALERT_RULES: ${{ github.workspace }}/deploy/monitoring/hermes-alerts.yml
          HERMES_ALERTMANAGER_CONFIG: ${{ github.workspace }}/deploy/monitoring/alertmanager.example.yml
        run: docker compose -f deploy/compose/monitoring.yaml config
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "${GITHUB_WORKSPACE}/deploy/monitoring:/etc/prometheus:ro" \
            prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager config
        run: |
          docker run --rm --entrypoint /bin/amtool \
            -v "${GITHUB_WORKSPACE}/deploy/monitoring:/etc/alertmanager:ro" \
            prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba \
            check-config /etc/alertmanager/alertmanager.example.yml
