# Image release pipeline (ROADMAP §37):
#   Source → CI → Build → Scan (Trivy) → SBOM (syft) → Sign (cosign keyless)
#   → Publish GHCR.
#
# Trigger: tag v* (release). Matrix: 6 image sesuai image-manifest.yaml —
# build context = ROOT repo (Dockerfile COPY path relatif root).
#
# Permissions:
#   packages: write  → push ke GHCR
#   id-token: write  → cosign keyless signing (OIDC/Fulcio)
name: images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-publish-sign:
    name: ${{ matrix.image }} — build / scan / SBOM / sign / publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: http-validator
            image: hermes-validator-http
            dockerfile: runtimes/docker/images/http-validator/Dockerfile
          - name: json-validator
            image: hermes-validator-json
            dockerfile: runtimes/docker/images/json-validator/Dockerfile
          - name: openapi-validator
            image: hermes-validator-openapi
            dockerfile: runtimes/docker/images/openapi-validator/Dockerfile
          - name: python-validator
            image: hermes-validator-python
            dockerfile: runtimes/docker/images/python-validator/Dockerfile
          - name: proxy
            image: hermes-proxy
            dockerfile: runtimes/docker/images/proxy/Dockerfile
          - name: tool-nuclei
            image: hermes-tool-nuclei
            dockerfile: runtimes/docker/images/tool-nuclei/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hitung owner-lowercase dan version dari tag
        id: meta
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # §37 urutan: Build → Scan SEBELUM publish. Image dibangun lokal
      # (load: true), discan, baru di-push bila build selesai. Hasil scan
      # HIGH/CRITICAL TIDAK menggagalkan build (exit-code: 0) tetapi
      # SARIF di-upload sebagai artifact untuk ditinjau.
      - name: Build image (lokal, untuk scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: hermes-local/${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Trivy (HIGH, CRITICAL — exit 0, hasil tetap di-upload)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hermes-local/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          ignore-unfixed: true

      - name: Upload hasil scan Trivy
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif
          if-no-files-found: error

      # Publish ke GHCR dengan tag versi (dari tag git, tanpa 'v') + tag sha.
      # Digest dari step ini dipakai untuk signing (image ref immutable).
      - name: Push ke GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ matrix.image }}:sha-${{ github.sha }}

      - name: Generate SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via OIDC (id-token: write). Sign terhadap DIGEST,
      # bukan tag — tag bisa bergerak, digest tidak (§14).
      - name: Sign image (cosign keyless, by digest)
        run: >
          cosign sign --yes
          ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}

      - name: Verify signature (sanity check)
        run: >
          cosign verify
          ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/'
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
