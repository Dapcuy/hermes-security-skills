# CI Go — build + test + vet control plane (ROADMAP §30, §35)
# Control plane Go adalah trusted computing base (§20) — harus selalu hijau.
name: ci-go

on:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci-go.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci-go.yml"

permissions:
  contents: read

jobs:
  go-build-test:
    name: go build / test / vet (control plane)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build semua package (go build ./...)
        run: go build ./...

      - name: Vet semua package (go vet ./...)
        run: go vet ./...

      - name: Test semua package (go test ./...)
        run: go test ./...

  go-build-test-wrapper:
    # Wrapper tool-nuclei adalah nested module terpisah (stdlib only) agar
    # build image tidak bergantung pada layout module control plane.
    name: go build / test / vet (tool-nuclei wrapper)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtimes/docker/images/tool-nuclei/wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build wrapper (go build ./...)
        run: go build ./...

      - name: Vet wrapper (go vet ./...)
        run: go vet ./...

      - name: Test wrapper (go test ./...)
        run: go test ./...
