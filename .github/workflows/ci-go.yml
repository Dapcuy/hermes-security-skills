# CI Go — build + test + vet control plane (ROADMAP §30, §35)
# Control plane Go adalah trusted computing base (§20) — harus selalu hijau.
name: ci-go

on:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci-go.yml"
      - "benchmarks/**"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci-go.yml"
      - "benchmarks/**"

permissions:
  contents: read

jobs:
  go-build-test:
    name: go build / test / vet (control plane, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go 1.23
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23"

      - name: Build semua package (go build ./...)
        run: go build ./...

      - name: Vet semua package (go vet ./...)
        run: go vet ./...

      - name: Test semua package (go test ./...)
        run: go test ./...

  go-build-test-wrapper:
    # Wrapper tool-nuclei adalah nested module terpisah (stdlib only) agar
    # build image tidak bergantung pada layout module control plane.
    name: go build / test / vet (tool-nuclei wrapper)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtimes/docker/images/tool-nuclei/wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go 1.23
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23"

      - name: Build wrapper (go build ./...)
        run: go build ./...

      - name: Vet wrapper (go vet ./...)
        run: go vet ./...

      - name: Test wrapper (go test ./...)
        run: go test ./...

  go-race:
    name: go test -race (trusted computing base)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Go 1.23
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23"

      - name: Race test control plane
        run: go test -race ./...

      - name: Race test tool wrappers
        shell: bash
        run: |
          set -euo pipefail
          for dir in runtimes/docker/images/*/wrapper; do
            if [[ -f "$dir/go.mod" ]]; then
              echo "== race testing $dir =="
              (cd "$dir" && go test -race ./...)
            fi
          done
