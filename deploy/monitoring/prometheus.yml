global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/hermes-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["hermes-alertmanager:9093"]

scrape_configs:
  - job_name: hermes-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["hermes-proxy:8080"]
